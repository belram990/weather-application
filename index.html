<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
</head>

<body>
    <div class="weather-app">
        <header>
            <form id="search-form">
                <input type="search" placeholder="Enter a city.." required class="search-input" id="search-input" />
                <input type="submit" value="Search" class="search-button" />
            </form>
        </header>
        <main>
            <div class="current-weather">
                <div>
                    <h1 class="current-city" id="current-city">___</h1>
                    <p class="current-details">
                        <span id="current-date"></span>
                        <span id="time">___</span>,
                        <span id="description">___</span><br />
                        Humidity: <strong id="humidity">___</strong>,
                        Wind: <strong id="wind-speed">___</strong>
                    </p>
                </div>
                <div class="current-temperature">
                    <div id="icon"></div>

                    <div class="current-temperature-value" id="current-temperature">___</div>
                    <div class="current-temperature-unit">°F</div>
                </div>
            </div>
            <div class="weather-forcast" id="forcast"></div>
        </main>
        <footer>
            <p>
                This project was coded by
                <a href="https://github.com/belram990" target="_blank">Donabel Liotta</a> and is
                <a href="https://github.com/belram990/weather-application" target="_blank"> on GitHub</a> and
                <a href="https://weatherguid-app.netlify.app" target="_blank">hosted on Netlify</a>
            </p>
        </footer>
    </div>
</body>
<script src="app.js"></script>

</html>
